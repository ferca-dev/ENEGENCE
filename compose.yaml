name: enegence

services:
  app:
    build:
      context: .
    command: php artisan serve --host=0.0.0.0 --port=8000
    working_dir: /app
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
      - composer_vendor:/app/vendor
    environment:
      COMPOSER_HOME: /tmp/composer
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-enegence}"
      MYSQL_USER: "${DB_USERNAME:-enegence}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-local}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-localroot}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  node:
    image: node:24-alpine
    working_dir: /app
    profiles: ["tools"]
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  composer_vendor:
  mysql_data:
  node_modules:
